
# Application
spring.application.name=smartresolve-ai
spring.config.import=optional:file:.env[.properties]
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartresolve_db}
spring.datasource.username=${DB_USERNAME:smartresolve}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.num-predict=512
spring.ai.ollama.chat.options.top-p=0.9
spring.ai.ollama.chat.options.top-k=40

# Ollama Embedding Model
spring.ai.ollama.embedding.model=mxbai-embed-large

# PostgreSQL PGVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=smartresolve_knowledge_vectors

# JDBC Chat Memory
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.com.smartresolve=INFO
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
